[bar]
order = [ "Top" ]

    [bar.Top]
    layer = "overlay"
    margin_ends = 0
    radius = 0
    reserve_space = false
    smart_auto_hide = true

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = false

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 67.83203125
    box_width = 242.3984375
    cx = 680.0
    cy = 158.083984375
    output = "HDMI-A-1"
    placement_height = 768.0
    placement_width = 1360.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        shadow = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 680.0
    cy = 586.0
    output = "HDMI-A-1"
    placement_height = 768.0
    placement_width = 1360.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.launcher]
categories = false
compact = true

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "foot" ]

[wallpaper]
directory = "/usr/share/backgrounds"
fill_mode = "center"

    [wallpaper.default]
    path = "/usr/share/backgrounds/crossos/clouds-3.jpg"

    [wallpaper.last]
    path = "/usr/share/backgrounds/crossos/clouds-3.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/usr/share/backgrounds/crossos/clouds-3.jpg"

[widget.clipboard]
enabled = false

[widget.control-center]
capsule_fill = "on_primary"
glyph = "crosshair"

[widget.media]
hide_when_no_media = true

[widget.tray]
hide_passive = false
